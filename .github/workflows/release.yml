name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/package/zapret-gui | Out-Null
          Copy-Item target/release/zapret-gui.exe target/package/zapret-gui/zapret-gui.exe
          Compress-Archive -Path target/package/zapret-gui -DestinationPath target/package/zapret-gui-windows-x86_64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: target/package/zapret-gui-windows-x86_64.zip
          generate_release_notes: true
