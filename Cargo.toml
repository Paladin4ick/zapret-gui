[package]
name = "zapret-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows GUI for Flowseal zapret-discord-youtube"
build = "build.rs"

[[bin]]
name = "zapret-gui"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
single-instance = "0.3"
slint = "1.19"
tray-icon = "0.26"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
